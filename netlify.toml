# Site estático: nenhum build necessário no Netlify. As páginas, robots.txt, sitemap.xml e
# llms.txt são gerados localmente com `python3 tools/build.py` e commitados.
[build]
  publish = "."

# ---------------------------------------------------------------------------
# Redirects. O Netlify aplica a PRIMEIRA regra que casar, na ordem deste arquivo.
# Uma regra "/caminho" também casa "/caminho/" (confirmado nos testes de /encanador
# e /eletricista antes desta mudança), por isso não repetimos as variantes com barra.
# Não há regra para /contato, /sobre, /faq nem /areas-atendidas: essas páginas agora existem
# e o Netlify já redireciona "/contato" -> "/contato/" sozinho (pretty URLs). Uma regra
# "/contato" -> "/contato/" poderia gerar loop.
# ---------------------------------------------------------------------------

# Subdomínio antigo da landing de hidráulica -> nova página.
# ATENÇÃO: esta regra SÓ VALE depois que o DNS de hidraulica.jainstalacoes.com apontar para ESTE
# projeto Netlify. Hoje o CNAME ainda aponta para encanadorjalp.netlify.app (projeto antigo),
# então o pedido nem chega aqui. O ajuste de DNS/domínio está FORA do escopo deste repositório.
[[redirects]]
  from = "https://hidraulica.jainstalacoes.com/*"
  to = "https://jainstalacoes.com/hidraulica/:splat"
  status = 301
  force = true

# www -> apex
[[redirects]]
  from = "https://www.jainstalacoes.com/*"
  to = "https://jainstalacoes.com/:splat"
  status = 301
  force = true

# /index.html e /index.php -> raiz (index.html existe como arquivo, por isso force = true)
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true
[[redirects]]
  from = "/index.php"
  to = "/"
  status = 301

